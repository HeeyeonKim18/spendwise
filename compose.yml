
services:
  postgres:
    image: postgres:17
    container_name: spendwise-postgres
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - spendwise-data:/var/lib/postgresql/data

volumes:
  spendwise-data:
